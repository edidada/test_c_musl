name: build libevent with musl

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build libevent with musl
        run: bash build-libevent.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libevent-musl
          path: install/
